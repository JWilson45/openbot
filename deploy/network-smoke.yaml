apiVersion: v1
kind: Namespace
metadata:
  name: openbot-validation-peer
---
apiVersion: v1
kind: Pod
metadata:
  name: target
  namespace: openbot-validation-peer
  labels:
    app: network-target
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 600
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
  containers:
    - name: target
      image: busybox:1.37
      command: [httpd, -f, -p, "8080", -h, /etc]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests: {cpu: 25m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: target
  namespace: openbot-validation-peer
spec:
  selector:
    app: network-target
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: network-client
  namespace: openbot-validation
  labels:
    app: network-client
spec:
  runtimeClassName: kata-qemu-runtime-rs
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 600
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
  containers:
    - name: client
      image: busybox:1.37
      command: [sleep, "600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: 500m, memory: 256Mi}
