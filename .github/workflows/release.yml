name: release
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Release tag (e.g. v0.3.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.3.0)
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 (Intel) images are gone; cross-compile x64 from arm64.
          - os: macos-14
            bun_targets: bun-darwin-arm64 bun-darwin-x64
            artifact: darwin
          - os: ubuntu-latest
            bun_targets: bun-linux-x64 bun-linux-arm64
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run scripts/build-binary.ts ${{ matrix.bun_targets }}
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/openbot-*
  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: flatten binaries
        run: |
          mkdir -p dist
          find artifacts -type f -name 'openbot-*' -exec cp {} dist/ \;
          chmod +x dist/openbot-*
          ls -la dist
          cp contrib/install.sh dist/install.sh
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release ${RELEASE_TAG} already exists; uploading assets"
            gh release upload "${RELEASE_TAG}" \
              dist/openbot-darwin-arm64 \
              dist/openbot-darwin-x64 \
              dist/openbot-linux-x64 \
              dist/openbot-linux-arm64 \
              dist/install.sh \
              --clobber
            exit 0
          fi
          gh release create "${RELEASE_TAG}" \
            dist/openbot-darwin-arm64 \
            dist/openbot-darwin-x64 \
            dist/openbot-linux-x64 \
            dist/openbot-linux-arm64 \
            dist/install.sh \
            --title "${RELEASE_TAG}" \
            --generate-notes
